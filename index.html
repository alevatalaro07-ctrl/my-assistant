<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Assistant</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; }
    header { background: #1e293b; padding: 16px; text-align: center; font-weight: 600; font-size: 1.1rem; border-bottom: 1px solid #334155; display: flex; justify-content: space-between; align-items: center; }
    header button { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; font-size: 0.95rem; line-height: 1.4; word-wrap: break-word; }
    .user { align-self: flex-end; background: #2563eb; color: #fff; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: #334155; color: #f1f5f9; border-bottom-left-radius: 4px; white-space: pre-wrap; }
    #input-area { background: #1e293b; padding: 12px; display: flex; gap: 8px; border-top: 1px solid #334155; }
    input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 16px; border-radius: 24px; color: #fff; font-size: 1rem; outline: none; }
    #send-btn { background: #2563eb; color: white; border: none; padding: 0 18px; border-radius: 24px; font-weight: 600; cursor: pointer; }
    #modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); padding: 20px; align-items: center; justify-content: center; }
    .modal-box { background: #1e293b; padding: 24px; border-radius: 16px; width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 12px; }
    .modal-box input { width: 100%; border-radius: 8px; }
    .modal-box button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <span>🤖 Assistente Personale</span>
    <button onclick="toggleModal()">⚙️</button>
  </header>

  <div id="chat"></div>

  <div id="input-area">
    <input type="text" id="userInput" placeholder="Scrivi un messaggio..." onkeypress="if(event.key==='Enter') sendMsg()">
    <button id="send-btn" onclick="sendMsg()">Invia</button>
  </div>

  <div id="modal">
    <div class="modal-box">
      <h3>Impostazioni API</h3>
      <p style="font-size: 0.85rem; color: #94a3b8;">Inserisci la tua API Key di Google AI Studio:</p>
      <input type="password" id="apiKeyInput" placeholder="AIzaSy...">
      <button onclick="saveApiKey()">Salva e Chiudi</button>
    </div>
  </div>

  <script>
    let apiKey = localStorage.getItem('gemini_pwa_key') || '';
    let chatHistory = [];

    window.onload = () => {
      if (!apiKey) toggleModal();
      else addMessage('bot', 'Ciao! Sono il tuo assistente personale. Come posso aiutarti oggi?');
    };

    function toggleModal() {
      const modal = document.getElementById('modal');
      modal.style.display = modal.style.display === 'flex' ? 'none' : 'flex';
      if (apiKey) document.getElementById('apiKeyInput').value = apiKey;
    }

    function saveApiKey() {
      const val = document.getElementById('apiKeyInput').value.trim();
      if (val) {
        apiKey = val;
        localStorage.setItem('gemini_pwa_key', apiKey);
        toggleModal();
        addMessage('bot', 'Chiave API salvata con successo! Inizia pure a scrivermi.');
      }
    }

    function addMessage(sender, text) {
      const chat = document.getElementById('chat');
      const div = document.createElement('div');
      div.className = `msg ${sender}`;
      div.innerText = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function sendMsg() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;
      if (!apiKey) { alert('Inserisci prima la tua API Key nelle impostazioni (⚙️)!'); toggleModal(); return; }

      addMessage('user', text);
      input.value = '';
      chatHistory.push({ role: 'user', parts: [{ text: text }] });

      const loadingDiv = document.createElement('div');
      loadingDiv.className = 'msg bot';
      loadingDiv.innerText = 'Sto pensando...';
      document.getElementById('chat').appendChild(loadingDiv);

      try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: chatHistory })
        });
        const data = await res.json();
        const reply = data.candidates[0].content.parts[0].text;
        
        loadingDiv.innerText = reply;
        chatHistory.push({ role: 'model', parts: [{ text: reply }] });
      } catch (err) {
        loadingDiv.innerText = 'Errore durante la connessione. Verifica la tua API Key.';
      }
    }
  </script>
</body>
</html>
